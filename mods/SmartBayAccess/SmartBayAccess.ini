; ============================================================================
; SmartBayAccess.ini — Multi-Bay Road Building Apron Batching
; ============================================================================
; mode:
;   0 = Vanilla (single vehicle maneuvering on building apron at a time)
;   1 = Same-Direction Batching (Default — allow simultaneous entries while
;       no vehicle is exiting, and simultaneous exits while none are entering)
;   2 = Unrestricted Bay Entry (allow simultaneous entry & exit whenever a
;       free physical bay exists)
; ============================================================================

[SmartBayAccess]
mode = 1
