; ============================================================================
; TechServiceControl — Mod-Specific Signature & Struct Offset Overrides
; ============================================================================
; Layered on top of common/config/offsets.ini via OffsetDocument::merge().
;
; Hooks Technical Services dispatch threshold checks in SOVIET64.exe:
;   1. RoadNode_HasSnow(RoadSearchRequest*, RoadNode*) -> bool
;   2. FindWaterTarget(GameObject*, Building* techOffice) -> Building*
;   3. FindSewageTarget(GameObject*, Building* techOffice) -> Building*
;   4. FindWasteTarget threshold load block (mixed 0.75f / fraction 0.60f)
; ============================================================================

[signatures]
; RoadNode_HasSnow(RoadSearchRequest* req, RoadNode* node) -> bool
road_node_has_snow_aob = 48 89 5C 24 08 48 89 74 24 10 48 89 7C 24 18 48 8B 42 30 33 DB 48 2B 42 28 48 8B FA 48 C1 F8 03 48 85 C0 74 ?? 4C 8B 5A 28 8B 71 20

; FindWaterTarget(GameObject* gameObj, Building* techOffice) -> Building*
;   +170: rel32 disp32 to GetWaterFillRatio(GameObject*, Building*) (next IP at +174)
;   +207: rel32 disp32 to IsWaterTruckEnRoute(Building*) (next IP at +211)
find_water_target_aob = 40 56 57 41 57 48 83 EC 20 48 8B 82 98 0F 00 00 33 F6 48 2B 82 90 0F 00 00 4C 8B F9 F3 0F 10 0D ?? ?? ?? ??
water_ratio_disp_off = 170
water_ratio_next_ip_off = 174
water_enroute_disp_off = 207
water_enroute_next_ip_off = 211

; FindSewageTarget(GameObject* gameObj, Building* techOffice) -> Building*
;   +168: rel32 disp32 to GetSewageFillRatio(GameObject*, Building*, int) (next IP at +172)
;   +191: rel32 disp32 to IsSewageTruckEnRoute(Building*) (next IP at +195)
find_sewage_target_aob = 40 56 57 41 57 48 83 EC 20 48 8B 82 98 0F 00 00 33 F6 48 2B 82 90 0F 00 00 4C 8B F9 F3 0F 10 15 ?? ?? ?? ??
sewage_ratio_disp_off = 168
sewage_ratio_next_ip_off = 172
sewage_enroute_disp_off = 191
sewage_enroute_next_ip_off = 195

; FindWasteTarget threshold load block:
;   +5:  RIP-relative disp32 for mixed waste threshold (0.75f, next IP at +9)
;   +47: RIP-relative disp32 for fraction waste threshold (0.60f, next IP at +51)
waste_threshold_block_aob = F3 44 0F 10 0D ?? ?? ?? ?? F3 0F 10 35 ?? ?? ?? ?? F3 44 0F 10 15 ?? ?? ?? ?? F3 0F 10 25 ?? ?? ?? ?? F3 44 0F 10 25 ?? ?? ?? ?? F3 0F 10 2D ?? ?? ?? ??
waste_mixed_disp_off = 5
waste_mixed_next_ip_off = 9
waste_frac_disp_off = 47
waste_frac_next_ip_off = 51

[profile.default]
tech_targets_begin_off = 0xF90
tech_targets_end_off   = 0xF98
bld_piped_water_off    = 0x133D
bld_piped_sewage_off   = 0x133E
