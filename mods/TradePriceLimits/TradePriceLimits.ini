; TradePriceLimits Global Configuration
; Mod managers (e.g. Republic Mod Loader -> "Open plugin INI / Settings")
; and players can edit this file before launching the game.

[settings]
; Overlay toggle hotkey (default: F8). Esc always closes when open.
; Supported values:
;   F1..F12, INSERT, DELETE, HOME, END, PAGEUP, PAGEDOWN, PAUSE,
;   SCROLLLOCK, BACKSPACE, TAB, TILDE, A..Z, 0..9, or hex VK (e.g. 0x77)
toggle_key=F8
