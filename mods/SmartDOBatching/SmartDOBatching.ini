; SmartDOBatching Global Configuration
; Mod managers (e.g. Republic Mod Loader -> "Open plugin INI / Settings")
; and players can edit this file before launching the game.

[settings]
; Minimum truck fill percentage (0-100). Road Distribution Office vehicles
; will only be dispatched when available cargo >= this % of vehicle capacity.
; 0 = vanilla behaviour (always dispatch when storage threshold crossed).
min_truck_fill_pct = 50.0

; Minimum train fill percentage (0-100). Rail Distribution Office consists
; will only be dispatched when available cargo >= this % of train capacity.
; 0 = vanilla behaviour.
min_train_fill_pct = 60.0

; Exempt essential survival goods from batch gating (true/false).
; When true, Food, Meat, Alcohol, Medicine/Chemicals, Coal, Water, and Fuel
; are always dispatched immediately regardless of fill thresholds, so towns
; never starve, freeze, or run out of power.
exempt_essentials = true

; Prevent deadlock on small buildings (true/false).
; When true, the minimum batch size is capped at 85% of the destination
; building's total storage capacity. Prevents a 12t truck assigned to a 4t
; grocery store or small heating plant from waiting forever for a batch that
; would never fit in the destination.
prevent_small_building_deadlock = true
