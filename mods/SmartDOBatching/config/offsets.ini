; ============================================================================
; SmartDOBatching — Mod-Specific Signature & Struct Offset Overrides
; ============================================================================
; Layered on top of common/config/offsets.ini via OffsetDocument::merge().
; SmartDOBatching reuses the shared dispatch_check_aob (EvaluateDistTask)
; from common/config/offsets.ini — no additional AOB needed.
;
; Vehicle & Building storage offsets for cargo batch sizing.
; ============================================================================

[profile.default]
; Vehicle cargo slot vector (std::vector-like, 8-byte ptr fields)
veh_cargo_vec_off     = 0x3B8
veh_cargo_vec_end_off = 0x3C0
; VehicleType descriptor (version-specific — overridden per profile below)
veh_type_off          = 0x1748
veh_type_category_off = 0x294
rail_category_min     = 3
rail_category_max     = 5
; Conservative per-slot capacity estimate (tons) — road truck minimum
; Override per vehicle type or leave at 12.0 (smallest covered truck).
veh_slot_capacity_tons = 12.0
; Building -> assigned vehicle ptr (DO's first vehicle slot)
bld_vehicle_slot_off  = 0x9C0
; BuildingDescriptor max storage (float tons) — 0x828 = $VEHICLE_LOADING_FACTOR area
; Use 0 to disable deadlock clamping via building storage
desc_max_storage_off  = 0x828

[profile.1.1.1.13]
veh_type_off = 0x1708

[profile.1.1.1.9]
veh_type_off = 0x1708

[profile.1.1.1.7]
veh_type_off = 0x1708
